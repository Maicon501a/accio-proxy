name: Release Builds

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão (ex: v1.0.0 ou latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact_slug }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact_slug: windows-amd64
            bin_name: accio-proxy.exe
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact_slug: linux-amd64
            bin_name: accio-proxy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/frontend/package-lock.json'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true
          cache-dependency-path: 'app/go.sum'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev || sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Frontend Dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build Wails Application
        working-directory: app
        run: |
          wails build -clean -trimpath -platform ${{ matrix.platform }}

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "app/build/bin/accio-proxy.exe" -Destination "dist/accio-proxy.exe"
          Copy-Item "app/build/bin/accio-proxy.exe" -Destination "dist/accio-proxy-windows-amd64.exe"
          Copy-Item "app/security-guard" -Destination "dist/security-guard" -Recurse
          Compress-Archive -Path "dist/accio-proxy.exe", "dist/security-guard" -DestinationPath "dist/accio-proxy-windows-amd64.zip"

      - name: Package Linux Binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          chmod +x app/build/bin/accio-proxy
          cp app/build/bin/accio-proxy dist/accio-proxy-linux-amd64
          tar -czvf dist/accio-proxy-linux-amd64.tar.gz -C app/build/bin accio-proxy

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: accio-proxy-${{ matrix.artifact_slug }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            PRERELEASE="false"
            TITLE="Release ${TAG}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag_name }}" && "${{ github.event.inputs.tag_name }}" != "latest" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
            PRERELEASE="false"
            TITLE="Release ${TAG}"
          else
            TAG="latest"
            PRERELEASE="false"
            TITLE="Accio Proxy (Latest Build)"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          make_latest: true
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          files: |
            release-assets/*
          body: |
            ## 🚀 Accio Proxy - Binários Prontos para Uso

            Compilações automatizadas via GitHub Actions para **Windows** e **Linux**.

            ### 📦 Downloads Rápidos:
            - 🪟 **Windows (Executável direto):** [`accio-proxy.exe`](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/accio-proxy.exe) *(Baixar e dar duplo clique)*
            - 🪟 **Windows (Zip):** [`accio-proxy-windows-amd64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/accio-proxy-windows-amd64.zip)
            - 🐧 **Linux (Binário):** [`accio-proxy-linux-amd64`](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/accio-proxy-linux-amd64)
            - 🐧 **Linux (Tar.gz):** [`accio-proxy-linux-amd64.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/accio-proxy-linux-amd64.tar.gz)

            ---

            ### 💻 Como Usar

            #### Windows
            1. Baixe e dê dois cliques no `accio-proxy.exe`.
            2. **Modo Direto (Standalone):** Os módulos nativos de segurança (`security-guard`) já vêm embutidos dentro do executável e são auto-extraídos transparentemente. Funciona direto sem precisar do app oficial instalado.
            3. **Modo Oficial:** Pode manter o Accio Desktop aberto se preferir sincronizar contas em tempo real.
            4. O proxy escuta em `http://127.0.0.1:8790` (compatível com OpenAI `/v1/chat/completions`).

            #### Linux
            ```bash
            chmod +x accio-proxy-linux-amd64
            ./accio-proxy-linux-amd64
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
